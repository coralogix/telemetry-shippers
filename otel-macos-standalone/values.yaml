global:
  domain: "eu1.coralogix.com"
  defaultApplicationName: "otel"
  defaultSubsystemName: "macos"
  logLevel: "info"
  collectionInterval: "30s"
  version: "0.0.60"

opentelemetry-agent:
  enabled: true
  distribution: "macos"
  presets:
    metadata:
      enabled: true
      integrationName: "coralogix-macos-standalone"
    hostEntityEvents:
      enabled: true
    fleetManagement:
      enabled: true
      agentType: "standalone"
      customAttributes: {}
    
    hostMetrics:
      enabled: true
      collectionInterval: "{{.Values.global.collectionInterval}}"
      process:
        enabled: true
    
    batch:
      enabled: true
    resourceDetection:
      enabled: true
      provider: "on-prem"
    # Removes a subset of attributes to be sent to Coralogix. It uses a denylist policy.
    reduceResourceAttributes:
      enabled: true
      pipelines: ["all"]
      provider: "on-prem"
    macosSystemLogs:
      enabled: true
      dynamicSubsystemName: true
    
    collectorMetrics:
      enabled: true
      scrapeInterval: "{{.Values.global.collectionInterval}}"
    
    otlpReceiver:
      enabled: true
    
    spanMetrics:
      enabled: true
      collectionInterval: "{{.Values.global.collectionInterval}}"
      metricsExpiration: 5m
    
    # spanMetricsMulti:
    #   enabled: false
    #   collectionInterval: "{{.Values.global.collectionInterval}}"
    #   metricsExpiration: 5m
    
    # headSampling:
    #   enabled: false
    #   percentage: 10
    #   mode: "proportional"
    
    transactions:
      enabled: true
      waitDuration: 30s
    
    zpages:
      enabled: true
    
    pprof:
      enabled: true
    
    semconv:
      enabled: true
    
    coralogixExporter:
      enabled: true
      privateKey: ${env:CORALOGIX_PRIVATE_KEY}
    # Configures the collector to scrape metrics from multiple Prometheus targets.
    # Adds a prometheus receiver to the metrics pipeline that scrapes each configured target
    # and optionally annotates the samples with application and subsystem labels.
    prometheusMulti:
      enabled: false
      scrapeInterval: "15s"
      targets: []
      # - name: mysql
      #   applicationName: ""
      #   subsystemName: ""
      #   ip: "127.0.0.1"
      #   port: 9104
      #   extraLabels: {}
    # Configures the collector with multiple filelog receivers.
    # Each receiver collects from a custom include list and can annotate entries
    # with Coralogix resource attributes.
    filelogMulti:
      enabled: false
      receivers: []
      # - name: backend-logs
      #   include:
      #     - /var/log/messages
      #   exclude: []
      #   forceFlushPeriod: "0"
      #   startAt: beginning
      #   multiline:
      #     lineStartPattern: "^\\d{4}-"
      #     lineEndPattern: "END$"
      #     omitPattern: false
      #   applicationName: "my-app"
      #   subsystemName: "backend"
      #   # Or use attributes for dynamic naming:
      #   # applicationNameAttribute: "service.namespace"
      #   # subsystemNameAttribute: "service.name"
      #   extraOperators:
      #     - type: regex_parser
      #       regex: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?P<sev>[A-Z]*) (?P<msg>.*)$'
      #       timestamp:
      #         parse_from: attributes.time
      #         layout: '%Y-%m-%d %H:%M:%S'
      #       severity:
      #         parse_from: attributes.sev
  config:
    receivers:
      filelog/macos-system-log:
        operators:
          - type: regex_parser
            regex: '^(?P<timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<host>[^\s]+)\s+(?P<app>[A-Za-z0-9._-]+)(?:\[(?P<proc_id>\d+)\])?:\s+(?P<msg>[\s\S]*)$'
          - type: time_parser
            parse_from: attributes.timestamp
            layout: Jan _2 15:04:05
            layout_type: gotime
            location: Local
          - type: move
            from: attributes.host
            to: resource["host.name"]
          - type: move
            from: attributes.app
            to: resource["app"]
          - type: copy
            from: resource["app"]
            to: resource["service.name"]
          - type: remove
            field: attributes.proc_id
            if: 'attributes.proc_id == ""'
          - type: remove
            field: attributes.timestamp
          - type: move
            from: attributes.msg
            to: body
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB:-512}
    service:
      pipelines:
        logs:
          exporters: []
        metrics:
          exporters: []
        traces:
          exporters: []
