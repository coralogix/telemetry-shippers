name: E2E Otel Installer Tests

on:
  pull_request:
    paths:
      - 'otel-installer/**'
      - '.github/workflows/e2e-otel-installer.yml'
      - '.github/workflows/windows-standalone-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CORALOGIX_PRIVATE_KEY: "test-key-12345"
  CORALOGIX_DOMAIN: "us1.coralogix.com"

jobs:
  #############################################
  # Detect changed paths (skip if only README; run relevant tests only)
  #############################################
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      standalone: ${{ steps.set-outputs.outputs.standalone }}
      docker: ${{ steps.set-outputs.outputs.docker }}
      windows: ${{ steps.set-outputs.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if only README changed
        id: readme-check
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- 'otel-installer/' '.github/workflows/e2e-otel-installer.yml' '.github/workflows/windows-standalone-e2e.yml' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NON_README=$(echo "$CHANGED" | grep -v -iE 'README\.md$' || true)
          if [ -z "$NON_README" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' && steps.readme-check.outputs.skip != 'true'
        with:
          filters: |
            standalone:
              - 'otel-installer/standalone/**'
              - '.github/workflows/e2e-otel-installer.yml'
            docker:
              - 'otel-installer/docker/**'
              - 'otel-installer/docker/e2e-test/**'
              - '.github/workflows/e2e-otel-installer.yml'
            windows:
              - 'otel-installer/windows/**'
              - '.github/workflows/e2e-otel-installer.yml'
      - id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "standalone=true" >> $GITHUB_OUTPUT
            echo "docker=true" >> $GITHUB_OUTPUT
            echo "windows=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.readme-check.outputs.skip }}" = "true" ]; then
            echo "standalone=false" >> $GITHUB_OUTPUT
            echo "docker=false" >> $GITHUB_OUTPUT
            echo "windows=false" >> $GITHUB_OUTPUT
          else
            echo "standalone=${{ steps.filter.outputs.standalone || 'false' }}" >> $GITHUB_OUTPUT
            echo "docker=${{ steps.filter.outputs.docker || 'false' }}" >> $GITHUB_OUTPUT
            echo "windows=${{ steps.filter.outputs.windows || 'false' }}" >> $GITHUB_OUTPUT
          fi

  #############################################
  # Standalone Script Tests
  #############################################

  standalone-linux-install:
    name: Standalone - Linux Install
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install (default)
        run: sudo CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/standalone/coralogix-otel-collector.sh
        
      - name: Verify service running
        run: sudo systemctl is-active otelcol-contrib
        
      - name: Verify health check
        run: curl -sf http://127.0.0.1:13133/ || true
      
      - name: Verify capabilities NOT set (no discovery/process metrics)
        run: |
          if getcap /usr/bin/otelcol-contrib 2>/dev/null | grep -q "cap_sys_ptrace"; then
            echo "Capabilities should not be set without discovery/process metrics" && exit 1
          fi
        
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall

  standalone-linux-version:
    name: Standalone - Linux Specific Version
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install specific version
        run: sudo CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/standalone/coralogix-otel-collector.sh -v 0.140.1
        
      - name: Verify version
        run: /usr/bin/otelcol-contrib --version | grep "0.140.1"
        
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall

  standalone-linux-config:
    name: Standalone - Linux Custom Config with Discovery
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create test config with discovery enabled
        run: |
          printf '%s\n' \
            '# CUSTOM_CONFIG_MARKER_E2E_TEST' \
            'extensions:' \
            '  host_observer:' \
            '    refresh_interval: 10s' \
            '  health_check:' \
            '    endpoint: 127.0.0.1:13133' \
            'receivers:' \
            '  receiver_creator/discovery:' \
            '    watch_observers:' \
            '      - host_observer' \
            '    receivers:' \
            '      nginx:' \
            '        rule: type == "hostport" and command matches "(?i)nginx"' \
            '        config:' \
            '          endpoint: "http://`endpoint`/nginx_status"' \
            '  otlp:' \
            '    protocols:' \
            '      grpc:' \
            '        endpoint: 0.0.0.0:4317' \
            'exporters:' \
            '  debug:' \
            '    verbosity: basic' \
            'service:' \
            '  extensions: [host_observer, health_check]' \
            '  pipelines:' \
            '    metrics:' \
            '      receivers: [receiver_creator/discovery, otlp]' \
            '      exporters: [debug]' \
            > /tmp/test-config.yaml
          
      - name: Install with discovery config
        run: sudo CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/standalone/coralogix-otel-collector.sh -c /tmp/test-config.yaml
        
      - name: Verify custom config loaded
        run: |
          sudo cat /etc/otelcol-contrib/config.yaml
          sudo grep "CUSTOM_CONFIG_MARKER_E2E_TEST" /etc/otelcol-contrib/config.yaml
          sudo grep "host_observer" /etc/otelcol-contrib/config.yaml
      
      - name: Verify discovery.env file created
        run: |
          sudo test -f /etc/otelcol-contrib/discovery.env
          sudo cat /etc/otelcol-contrib/discovery.env
          sudo grep -q "POSTGRES" /etc/otelcol-contrib/discovery.env || true
      
      - name: Verify capabilities auto-enabled
        run: |
          getcap /usr/bin/otelcol-contrib | grep -q "cap_sys_ptrace" || (echo "CAP_SYS_PTRACE not set" && exit 1)
          getcap /usr/bin/otelcol-contrib | grep -q "cap_dac_read_search" || (echo "CAP_DAC_READ_SEARCH not set" && exit 1)
        
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall

  standalone-linux-upgrade-with-config:
    name: Standalone - Linux Upgrade with New Config
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install (default version with default config)
        run: sudo CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/standalone/coralogix-otel-collector.sh
        
      - name: Verify default config exists
        run: |
          sudo cat /etc/otelcol-contrib/config.yaml
          # Package default has otlp receiver
          sudo grep "otlp:" /etc/otelcol-contrib/config.yaml
        
      - name: Create new custom config with marker
        run: |
          printf '%s\n' \
            '# UPGRADED_CONFIG_MARKER_E2E_TEST' \
            'receivers:' \
            '  otlp:' \
            '    protocols:' \
            '      grpc:' \
            '        endpoint: 0.0.0.0:4317' \
            'exporters:' \
            '  debug:' \
            '    verbosity: detailed' \
            'extensions:' \
            '  health_check:' \
            '    endpoint: 127.0.0.1:13133' \
            'service:' \
            '  extensions: [health_check]' \
            '  pipelines:' \
            '    logs:' \
            '      receivers: [otlp]' \
            '      exporters: [debug]' \
            > /tmp/new-config.yaml
        
      - name: Upgrade with new config (auto-detects and replaces)
        run: sudo CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/standalone/coralogix-otel-collector.sh -c /tmp/new-config.yaml
        
      - name: Verify new config loaded
        run: |
          sudo cat /etc/otelcol-contrib/config.yaml
          sudo grep "UPGRADED_CONFIG_MARKER_E2E_TEST" /etc/otelcol-contrib/config.yaml
          sudo grep "verbosity: detailed" /etc/otelcol-contrib/config.yaml
        
      - name: Verify service still running
        run: sudo systemctl is-active otelcol-contrib
        
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall

  standalone-linux-supervisor:
    name: Standalone - Linux Supervisor Mode
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install supervisor mode
        run: |
          sudo CORALOGIX_DOMAIN="${CORALOGIX_DOMAIN}" CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" \
            bash ./otel-installer/standalone/coralogix-otel-collector.sh -s \
            --opamp-attribute fleet.test.id=fleet-demo \
            --opamp-attribute 'deployment.environment=staging=blue'

      - name: Verify Supervisor attributes
        run: |
          sudo grep -Fx '      service.name: "opentelemetry-collector"' /etc/opampsupervisor/config.yaml
          sudo grep -Fx '      cx.agent.type: "standalone"' /etc/opampsupervisor/config.yaml
          sudo grep -Fx '      "fleet.test.id": "fleet-demo"' /etc/opampsupervisor/config.yaml
          sudo grep -Fx '      "deployment.environment": "staging=blue"' /etc/opampsupervisor/config.yaml
        
      - name: Verify supervisor running
        run: sudo systemctl is-active opampsupervisor
      
      - name: Verify capabilities auto-enabled in supervisor mode
        run: |
          getcap /usr/local/bin/otelcol-contrib | grep -q "cap_sys_ptrace" || (echo "CAP_SYS_PTRACE not set" && exit 1)
          getcap /usr/local/bin/otelcol-contrib | grep -q "cap_dac_read_search" || (echo "CAP_DAC_READ_SEARCH not set" && exit 1)
      
      - name: Verify opampsupervisor.conf exists
        run: |
          sudo test -f /etc/opampsupervisor/opampsupervisor.conf
          sudo cat /etc/opampsupervisor/opampsupervisor.conf
        
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall

  standalone-linux-supervisor-versions:
    name: Standalone - Linux Supervisor Custom Versions
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install with custom versions
        run: |
          sudo CORALOGIX_DOMAIN="${CORALOGIX_DOMAIN}" CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" \
            bash ./otel-installer/standalone/coralogix-otel-collector.sh -s \
            --supervisor-version 0.140.0 --collector-version 0.140.0
        
      - name: Verify supervisor running
        run: sudo systemctl is-active opampsupervisor
      
      - name: Verify capabilities auto-enabled in supervisor mode
        run: |
          getcap /usr/local/bin/otelcol-contrib | grep -q "cap_sys_ptrace" || (echo "CAP_SYS_PTRACE not set" && exit 1)
          getcap /usr/local/bin/otelcol-contrib | grep -q "cap_dac_read_search" || (echo "CAP_DAC_READ_SEARCH not set" && exit 1)
        
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall
      
      - name: Install supervisor with --disable-capabilities
        run: |
          sudo CORALOGIX_DOMAIN="${CORALOGIX_DOMAIN}" CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" \
            bash ./otel-installer/standalone/coralogix-otel-collector.sh -s --disable-capabilities
      
      - name: Verify capabilities NOT set with --disable-capabilities in supervisor mode
        run: |
          if getcap /usr/local/bin/otelcol-contrib 2>/dev/null | grep -q "cap_sys_ptrace"; then
            echo "Capabilities should not be set with --disable-capabilities flag in supervisor mode" && exit 1
          fi
      
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall

  standalone-linux-purge:
    name: Standalone - Linux Uninstall with Purge
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Supervisor with attributes
        run: |
          sudo CORALOGIX_DOMAIN="${CORALOGIX_DOMAIN}" CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" \
            bash ./otel-installer/standalone/coralogix-otel-collector.sh --supervisor \
            --opamp-attribute fleet.test.id=fleet-demo \
            --opamp-attribute 'deployment.environment=staging=blue'
        
      - name: Uninstall with purge
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall --purge
        
      - name: Verify config removed
        run: |
          if [ -f /etc/otelcol-contrib/config.yaml ]; then
            echo "Config still exists!" && exit 1
          fi

  standalone-macos:
    name: Standalone - macOS LaunchDaemon
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install
        run: |
          sudo CORALOGIX_DOMAIN="${CORALOGIX_DOMAIN}" CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" \
            bash ./otel-installer/standalone/coralogix-otel-collector.sh -s \
              --opamp-attribute 'fleet.test.id=fleet-demo' \
              --opamp-attribute 'deployment.environment=staging=blue'
        
      - name: Verify binary installed
        run: /usr/local/bin/otelcol-contrib --version
        
      - name: Verify Supervisor attributes and service
        run: |
          sudo grep -Fx '      "fleet.test.id": "fleet-demo"' /etc/opampsupervisor/config.yaml
          sudo grep -Fx '      "deployment.environment": "staging=blue"' /etc/opampsupervisor/config.yaml
          sudo launchctl print system/com.coralogix.opampsupervisor
        
      - name: Uninstall
        run: sudo bash ./otel-installer/standalone/coralogix-otel-collector.sh --uninstall

  # Note: LaunchAgent tests are skipped in CI because GitHub Actions runners
  # don't have GUI sessions. LaunchAgent requires user login context.
  # The LaunchDaemon test above covers macOS functionality.

  #############################################
  # Docker Script Tests
  #############################################

  docker-install:
    name: Docker - Regular Install
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install
        run: CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/docker/docker-install.sh
        
      - name: Verify container running
        run: |
          sleep 3
          docker ps | grep coralogix-otel-collector
          
      - name: Uninstall
        run: bash ./otel-installer/docker/docker-install.sh --uninstall

  docker-version:
    name: Docker - Specific Version
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install specific version
        run: CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/docker/docker-install.sh -v 0.140.0
        
      - name: Verify container running
        run: |
          sleep 3
          docker ps | grep coralogix-otel-collector
          
      - name: Uninstall
        run: bash ./otel-installer/docker/docker-install.sh --uninstall

  docker-config:
    name: Docker - Custom Config
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create test config with unique marker
        run: |
          printf '%s\n' \
            '# CUSTOM_CONFIG_MARKER_E2E_TEST' \
            'receivers:' \
            '  otlp:' \
            '    protocols:' \
            '      grpc:' \
            '        endpoint: 0.0.0.0:4317' \
            'exporters:' \
            '  debug:' \
            '    verbosity: basic' \
            'extensions:' \
            '  health_check:' \
            '    endpoint: 0.0.0.0:13133' \
            'service:' \
            '  extensions: [health_check]' \
            '  pipelines:' \
            '    logs:' \
            '      receivers: [otlp]' \
            '      exporters: [debug]' \
            > /tmp/test-config.yaml
          
      - name: Show test config
        run: cat /tmp/test-config.yaml
          
      - name: Install with custom config
        run: CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/docker/docker-install.sh -c /tmp/test-config.yaml
        
      - name: Verify container running
        run: |
          sleep 5
          docker ps -a | grep coralogix-otel-collector
          
      - name: Show container logs
        if: always()
        run: docker logs coralogix-otel-collector 2>&1 | tail -30
          
      - name: Verify custom config loaded
        run: |
          docker cp coralogix-otel-collector:/etc/otelcol-contrib/config.yaml /tmp/container-config.yaml
          cat /tmp/container-config.yaml
          grep "CUSTOM_CONFIG_MARKER" /tmp/container-config.yaml
          
      - name: Verify health check
        run: curl -sf http://localhost:13133/ || true
          
      - name: Uninstall
        run: bash ./otel-installer/docker/docker-install.sh --uninstall

  docker-supervisor:
    name: Docker - Supervisor Mode
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: otel-installer/docker/e2e-test/go.mod
          cache-dependency-path: otel-installer/docker/e2e-test/go.sum

      - name: Run supervisor OpAMP e2e test
        # Installs Supervisor mode against an in-process opamp-go server and
        # asserts rendered attributes, container liveness, and AgentHealth
        # reported over OpAMP (see supervisor_test.go).
        working-directory: otel-installer/docker/e2e-test
        # -count=1 defeats the go test result cache: these tests shell out to
        # otel-installer/docker/docker-install.sh, which the cache does not
        # track - a change to the installer must re-run the tests.
        run: go test -count=1 -v -timeout 15m ./...

      - name: Reject invalid Supervisor flags before installation
        run: |
          if CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/docker/docker-install.sh --opamp-attribute invalid; then
            echo "malformed attribute unexpectedly succeeded" >&2
            exit 1
          fi
          if CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/docker/docker-install.sh --opamp-attribute fleet.test.id=duplicate; then
            echo "attribute outside supervisor mode unexpectedly succeeded" >&2
            exit 1
          fi
          if CORALOGIX_PRIVATE_KEY="${CORALOGIX_PRIVATE_KEY}" bash ./otel-installer/docker/docker-install.sh --opamp-endpoint http://127.0.0.1:4320/opamp/v1; then
            echo "OpAMP endpoint outside supervisor mode unexpectedly succeeded" >&2
            exit 1
          fi

  #############################################
  # Windows Script Tests
  #############################################

  ############################################################################################
  # Standalone - Windows tests: each scenario runs up to 5 attempts. The hosted Windows
  # pool loses runners mid-job (~30% observed 2026-11-18: 45-min hang, null step
  # conclusions; passes on a fresh runner). Attempt N is skipped unless attempts
  # 1..N-1 all failed, so a green run costs exactly one attempt. Scenario bodies
  # live once in windows-standalone-e2e.yml.
  ############################################################################################

  windows-install-a1:
    name: Standalone - Windows Install (attempt 1)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows-standalone-e2e.yml
    secrets:
      CORALOGIX_PRIVATE_KEY: ${{ secrets.E2E_CORALOGIX_PRIVATE_KEY || 'test-key-12345' }}
      CORALOGIX_DOMAIN: ${{ secrets.E2E_CORALOGIX_DOMAIN || 'us1.coralogix.com' }}
    with:
      scenario: install
      attempt: 1

  windows-install-a2:
    name: Standalone - Windows Install (attempt 2)
    needs: [windows-install-a1]
    if: needs.changes.outputs.windows == 'true' && needs.windows-install-a1.result == 'failure'
    uses: ./.github/workflows/windows-standalone-e2e.yml
    secrets:
      CORALOGIX_PRIVATE_KEY: ${{ secrets.E2E_CORALOGIX_PRIVATE_KEY || 'test-key-12345' }}
      CORALOGIX_DOMAIN: ${{ secrets.E2E_CORALOGIX_DOMAIN || 'us1.coralogix.com' }}
    with:
      scenario: install
      attempt: 2

  windows-install-a3:
    name: Standalone - Windows Install (attempt 3)
    needs: [windows-install-a1, windows-install-a2]
    if: needs.changes.outputs.windows == 'true' && needs.windows-install-a1.result == 'failure' && needs.windows-install-a2.result == 'failure'
    uses: ./.github/workflows/windows-standalone-e2e.yml
    secrets:
      CORALOGIX_PRIVATE_KEY: ${{ secrets.E2E_CORALOGIX_PRIVATE_KEY || 'test-key-12345' }}
      CORALOGIX_DOMAIN: ${{ secrets.E2E_CORALOGIX_DOMAIN || 'us1.coralogix.com' }}
    with:
      scenario: install
      attempt: 3

  windows-install-a4:
    name: Standalone - Windows Install (attempt 4)
    needs: [windows-install-a1, windows-install-a2, windows-install-a3]
    if: needs.changes.outputs.windows == 'true' && needs.windows-install-a1.result == 'failure' && needs.windows-install-a2.result == 'failure' && needs.windows-install-a3.result == 'failure'
    uses: ./.github/workflows/windows-standalone-e2e.yml
    secrets:
      CORALOGIX_PRIVATE_KEY: ${{ secrets.E2E_CORALOGIX_PRIVATE_KEY || 'test-key-12345' }}
      CORALOGIX_DOMAIN: ${{ secrets.E2E_CORALOGIX_DOMAIN || 'us1.coralogix.com' }}
    with:
      scenario: install
      attempt: 4

  windows-install-a5:
    name: Standalone - Windows Install (attempt 5)
    needs: [windows-install-a1, windows-install-a2, windows-install-a3, windows-install-a4]
    if: needs.changes.outputs.windows == 'true' && needs.windows-install-a1.result == 'failure' && needs.windows-install-a2.result == 'failure' && needs.windows-install-a3.result == 'failure' && needs.windows-install-a4.result == 'failure'
    uses: ./.github/workflows/windows-standalone-e2e.yml
    secrets:
      CORALOGIX_PRIVATE_KEY: ${{ secrets.E2E_CORALOGIX_PRIVATE_KEY || 'test-key-12345' }}
      CORALOGIX_DOMAIN: ${{ secrets.E2E_CORALOGIX_DOMAIN || 'us1.coralogix.com' }}
    with:
      scenario: install
      attempt: 5

  windows-version-a1:
    name: Standalone - Windows Specific Version (attempt 1)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows-standalone-e2e.yml
    secrets:
      CORALOGIX_PRIVATE_KEY: ${{ secrets.E2E_CORALOGIX_PRIVATE_KEY || 'test-key-12345' }}
      CORALOGIX_DOMAIN: ${{ secrets.E2E_CORALOGIX_DOMAIN || 'us1.coralogix.com' }}
    with:
      scenario: version
      attempt: 1

  windows-version-a2:
    name: Standalone - Windows Specific Version (attempt 2)
    needs: [windows-version-a1]
    if: needs.changes.outputs.windows == 'true' && needs.windows-version-a1.result == 'failure'
    uses: ./.github/workflows/windows-standalone-e2e.yml
    secrets:
