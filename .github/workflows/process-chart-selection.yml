name: Process Chart Selection

on:
  pull_request:
    types: [unlabeled]

jobs:
  revert-chart:
    if: |
      startsWith(github.event.label.name, 'chart:') &&
      contains(github.event.pull_request.labels.*.name, 'otel-collector-bump') &&
      (github.event.pull_request.user.login == 'github-actions[bot]' ||
       github.event.pull_request.user.login == 'eco-system-automation[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Revert chart
        run: |
          CHART="${{ github.event.label.name }}"
          CHART="${CHART#chart:}"
          
          # Map chart to path
          case "$CHART" in
            otel-integration) CHART_PATH="otel-integration/" ;;
            *) CHART_PATH="${CHART}/" ;;
          esac
          
          echo "Reverting $CHART (path: $CHART_PATH)"
          
          # Revert to base branch
          git checkout origin/${{ github.event.pull_request.base.ref }} -- "$CHART_PATH"
          
          # Commit if changes exist
          if ! git diff --staged --quiet; then
            echo "chart_name=$CHART" >> $GITHUB_ENV
          else
            echo "No changes to revert for $CHART"
            exit 0
          fi

      - name: Create App token
        if: env.chart_name != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ECO_SYSTEM_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ECO_SYSTEM_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push signed revert
        if: env.chart_name != ''
        uses: pgaskin/push-signed-commits@v1.2.1
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: skip ${{ env.chart_name }} from upgrade"

      - name: Add comment
        if: env.chart_name != ''
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⏭️ **Skipped ${{ env.chart_name }}** - changes reverted."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
